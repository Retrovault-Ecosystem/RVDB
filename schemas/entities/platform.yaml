# =====================================================
# RVDB Platform Schema
# =====================================================

required: []

optional:
  - manufacturer
  - release_year
  - generation
  - category
  - media
  - extensions

fields:

  manufacturer:
    type: entity_reference_list
    entity_type: manufacturer
    description: Canonical platform manufacturer IDs

  release_year:
    type: integer_or_null
    description: Original hardware release year

  generation:
    type: integer_or_null
    description: Hardware generation

  category:
    type: list
    description: Platform categories

  media:
    type: list
    description: Physical or digital media types

  extensions:
    type: list
    description: Common ROM or software extensions

relationships:

  supports_core:
    type: entity_reference_list
    entity_type: core
    description: Emulator cores supporting this platform
