# RVDB Platform Schema

required:
  - manufacturer
  - release_year
  - generation
  - category

optional:
  - metadata

fields:

  manufacturer:
    type: list
    description: Platform manufacturer IDs

  release_year:
    type: integer_or_null
    description: Original release year

  generation:
    type: integer_or_null
    description: Console generation

  category:
    type: list
    description: Platform categories
