# =====================================================
# RVDB Platform Schema v2
# =====================================================

required:
  - category

optional:
  - manufacturer
  - family
  - release_year
  - generation
  - regions
  - media
  - extensions
  - architecture

fields:

  manufacturer:
    type: entity_reference_list
    entity_type: manufacturer
    description: Canonical platform manufacturer IDs

  family:
    type: string
    description: Canonical hardware or platform family name

  release_year:
    type: integer_or_null
    description: Original hardware release year

  generation:
    type: integer_or_null
    description: Hardware generation

  category:
    type: list
    items:
      type: string
      enum:
        - console
        - handheld
        - computer
        - arcade
    description: Canonical platform classifications

  regions:
    type: list
    items:
      type: string
    description: Regions in which the platform was officially released

  media:
    type: list
    items:
      type: string
      enum:
        - cartridge
        - floppy
        - optical-disc
        - cassette
        - digital
    description: Physical or digital media types supported by the platform

  extensions:
    type: list
    items:
      type: string
    description: Common software, ROM, or disk-image extensions

  architecture:
    type: list
    items:
      type: string
    description: Canonical processor or hardware architecture identifiers

relationships:

  supports_core:
    type: entity_reference_list
    entity_type: core
    description: Emulator cores supporting this platform
